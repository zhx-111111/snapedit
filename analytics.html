<!--
  Cloudflare Web Analytics 接入说明
  =====================================
  1. 在 Cloudflare Dashboard → Analytics → Web Analytics 创建站点
  2. 复制给你的一段 <script> 标签（形如 <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token":"xxx"}'></script>）
  3. 粘贴到 index.html 的 <head> 中即可
  
  优势：
  - 零成本、不限流量
  - 不依赖 Cookie，隐私友好
  - 与 Pages 同账号自动打通
-->
